[package]
name = "grayspace-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grayspace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
drag = "2.1.0"
notify = "6.1"
regex = "1"
image = { version = "0.25", default-features = true }
fast_image_resize = "5"
sha2 = "0.10"
webp = "0.3"
trash = "5"
# 2.5+ requires tauri 2.12; keep in step with @tauri-apps/api (2.10) before upgrading
tauri-plugin-single-instance = "~2.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
] }
# Same version as Tauri's, so it is built once and Window::hwnd() returns this crate's HWND.
windows = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
drag = { path = "vendor/drag" }

[profile.dev.package."*"]
opt-level = 2
